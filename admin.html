<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">Admin Dashboard</span>
  </div>
</nav>

<div class="container mt-4">
  <div class="card shadow">
    <div class="card-body">
      <h4 class="mb-3">Registered Users</h4>

      <div class="table-responsive">
        <table class="table table-bordered table-hover text-center align-middle">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Email</th>
              <th>Contact</th>
              <th>QR ID</th>
              <th>QR</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="7">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- QR Modal -->
<div class="modal fade" id="qrModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center">
      <div class="modal-header">
  <div class="w-100 text-center">
    <h5 class="modal-title">User QR Code</h5>
  </div>
  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
      <div class="modal-body d-flex flex-column align-items-center justify-content-center">
  <p class="mb-3 text-center">Scan this QR Code</p>
  <div id="qrContainer"></div>
</div>
    </div>
  </div>
</div>
<!-- QR Code library -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCp02Ofq_Z4GxCj2ZSLyOsag-n6BWc7bys",
  authDomain: "registration-form-69997.firebaseapp.com",
  projectId: "registration-form-69997",
  storageBucket: "registration-form-69997.firebasestorage.app",
  messagingSenderId: "58234209234",
  appId: "1:58234209234:web:044194a0cbbb1a26e43e0b",
  measurementId: "G-FEEFRT99P9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const tableBody = document.getElementById("tableBody");

async function loadData() {
  tableBody.innerHTML = "";

  const q = query(collection(db, "registrations"), orderBy("createdAt", "desc"));
  const snap = await getDocs(q);

  let i = 1;
  snap.forEach(doc => {
    const d = doc.data();

    // Create table row dynamically
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${i++}</td>
      <td>${d.firstName}</td>
      <td>${d.lastName}</td>
      <td>${d.email}</td>
      <td>${d.contact}</td>
      <td>${doc.id}</td>
      <td><button class="btn btn-sm btn-secondary">View QR</button></td>
    `;

    // Add event listener safely
    const btn = tr.querySelector("button");
btn.addEventListener("click", () => {
  const qrContainer = document.getElementById("qrContainer");
  qrContainer.innerHTML = "";

  const qrData = JSON.stringify({
    id: doc.id,
    name: d.firstName + " " + d.lastName,
    email: d.email
  });

  new QRCode(qrContainer, { text: qrData, width: 200, height: 200 });

  const modal = new bootstrap.Modal(document.getElementById("qrModal"));
  modal.show();
});


    tableBody.appendChild(tr);
  });
}


loadData();

// Show QR modal function
function showQR(id, fname, lname, email) {
  const qrContainer = document.getElementById("qrContainer");
  qrContainer.innerHTML = "";

  const qrData = JSON.stringify({ id, name: fname + " " + lname, email });
  new QRCode(qrContainer, { text: qrData, width: 200, height: 200 });

  const modal = new bootstrap.Modal(document.getElementById("qrModal"));
  modal.show();
}
</script>

</body>
</html>
