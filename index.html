<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Registration</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- QR Code -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card shadow">
        <div class="card-body">

          <h3 class="text-center mb-4">Registration Form</h3>

          <form id="regForm">

            <div class="mb-3">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control" id="fname" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control" id="lname" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="email" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Contact Number</label>
              <input type="text" class="form-control" id="contact" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Register</button>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>

<!-- ✅ SUCCESS MODAL -->
<div class="modal fade" id="successModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center">

      <div class="modal-header">
        <h5 class="modal-title">Registration Successful 🎉</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <p>Save your QR Code</p>
        <div id="qrcode" class="d-flex justify-content-center mb-3"></div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-success" data-bs-dismiss="modal">Done</button>
      </div>

    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- 🔥 FIREBASE + JS -->
<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // ✅ PUT YOUR FIREBASE CONFIG HERE
  const firebaseConfig = {
  apiKey: "AIzaSyCp02Ofq_Z4GxCj2ZSLyOsag-n6BWc7bys",
  authDomain: "registration-form-69997.firebaseapp.com",
  projectId: "registration-form-69997",
  storageBucket: "registration-form-69997.firebasestorage.app",
  messagingSenderId: "58234209234",
  appId: "1:58234209234:web:044194a0cbbb1a26e43e0b",
  measurementId: "G-FEEFRT99P9"
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const form = document.getElementById("regForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = {
      firstName: fname.value,
      lastName: lname.value,
      email: email.value,
      contact: contact.value,
      createdAt: serverTimestamp()
    };

    try {
      const docRef = await addDoc(collection(db, "registrations"), data);

      // 👉 Generate QR using doc ID
      document.getElementById("qrcode").innerHTML = "";
      new QRCode("qrcode", {
        text: docRef.id,
        width: 200,
        height: 200
      });

      // show modal
      const modal = new bootstrap.Modal(document.getElementById('successModal'));
      modal.show();

      form.reset();

    } catch (err) {
      alert("Error saving data: " + err.message);
    }

  });

</script>

</body>
</html>
